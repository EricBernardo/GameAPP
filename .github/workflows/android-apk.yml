name: Build Android APK (Party Royale)

on:
  push:
    branches: [main]
    paths:
      - "mobile/party-royale-android/**"
      - "prototype/party-royale/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: mobile/party-royale-android
        run: npm install

      - name: Sync latest web assets from prototype
        run: |
          rm -rf mobile/party-royale-android/www
          mkdir -p mobile/party-royale-android/www
          cp -r prototype/party-royale/. mobile/party-royale-android/www/

      - name: Capacitor sync
        working-directory: mobile/party-royale-android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile/party-royale-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: party-royale-debug-apk
          path: mobile/party-royale-android/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
