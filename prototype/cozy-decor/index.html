<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<title>Cantinho Cozy — Protótipo</title>
<link rel="stylesheet" href="style.css" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" href="icon-192.png" />
<meta name="theme-color" content="#ff9f7a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Cantinho Cozy" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="coins-pill">🪙 <span id="coins-value">0</span></div>
      <div id="level-wrap">
        <span id="level-label">Nível 1</span>
        <div class="xp-bar"><div id="xp-fill"></div></div>
      </div>
    </header>

    <div id="customer-card">
      <div class="customer-avatar" id="customer-avatar">🧑</div>
      <div class="customer-bubble">
        <div class="customer-name" id="customer-name">Nino</div>
        <div class="customer-text" id="customer-text">Quero um cantinho tropical! 🌴</div>
      </div>
      <button id="btn-deliver" class="btn-primary small">ENTREGAR</button>
    </div>

    <div id="room-wrap">
      <canvas id="room-canvas"></canvas>
    </div>

    <div id="backdrop-row"></div>

    <div id="shop">
      <div id="category-tabs"></div>
      <div id="item-grid"></div>
    </div>

    <div id="placing-banner" class="hidden">
      Escolha um espaço vazio no quarto para colocar <b id="placing-name"></b>
      <button id="btn-cancel-placing">Cancelar</button>
    </div>

    <div id="toast"></div>
  </div>

  <script type="module" src="src/main.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
